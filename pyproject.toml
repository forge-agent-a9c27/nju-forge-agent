[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nju-forge-agent"
version = "1.0.0"
description = "A transparent, safe, framework-free coding agent"
readme = "README.txt"
requires-python = ">=3.8"
authors = [{name = "NJU Software Engineering Candidate"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
forge = "forge_agent.cli:main"

[tool.setuptools]
packages = ["forge_agent"]
